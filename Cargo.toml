cargo-features = ["edition2024"]

[package]
name = "syres"
version = "0.1.0"
description = "Make reservations at Switchyards"
authors = ["Jimmy Alford <jimmy.alford316@gmail.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/jalford14/syres"

[dependencies]
chrono = "0.4"
crossterm = "0.28.1"
ratatui = "0.29.0"
color-eyre = "0.6.3"
reqwest = { version = "0.11", features = ["json", "cookies", "blocking"] }
scraper = "0.24"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
